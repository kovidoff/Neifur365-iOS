name: Build iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          SIM_ID=$(xcrun simctl list devices available iPhone -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime in sorted(data.keys(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for dev in data[runtime]:
                  if dev.get('isAvailable') and 'iPhone' in dev.get('name', ''):
                      print(dev['udid'])
                      sys.exit(0)
          ")
          echo "Using simulator UDID: $SIM_ID"
          set -o pipefail
          xcodebuild test \
            -project Neifur365.xcodeproj \
            -scheme Neifur365 \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build_test.log || {
              grep -E " error:|fatal error:|BUILD FAILED|\*\* TEST FAILED" build_test.log | head -n 20 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Build unsigned Release app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Neifur365.xcodeproj \
            -scheme Neifur365 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO 2>&1 | tee build_release.log || {
              grep -E " error:|fatal error:|BUILD FAILED" build_release.log | head -n 20 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Package unsigned IPA
        run: |
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Neifur365.app build/ipa/Payload/
          cd build/ipa
          zip -r -y -q ../Neifur365.ipa Payload
          unzip -t -q ../Neifur365.ipa
          ls -lh ../Neifur365.ipa

      - name: Upload Neifur365.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Neifur365-unsigned-ipa
          path: build/Neifur365.ipa
          compression-level: 0
          retention-days: 30

      - name: Publish dev pre-release IPA
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev build/Neifur365.ipa --clobber
            gh release edit dev --notes "Автосборка из \`main\` (build #${{ github.run_number }}, commit \`${GITHUB_SHA::7}\`). Неподписанный IPA для Gbox / Feather / SideStore."
          else
            gh release create dev build/Neifur365.ipa \
              --prerelease \
              --title "Dev Build (latest)" \
              --notes "Автосборка из \`main\` (build #${{ github.run_number }}, commit \`${GITHUB_SHA::7}\`). Неподписанный IPA для Gbox / Feather / SideStore."
          fi
